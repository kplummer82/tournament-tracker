name: CI

on:
  push:
    branches: [master, ldqa]
  pull_request:

# Gate: typecheck (ignoreBuildErrors is off) + ESLint + compile, the same checks
# Vercel runs on deploy — caught here before a bad commit reaches a deploy.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Dummy connection string so lib/db.ts / neon() construct at build time.
      # `next build` runs no queries, so no real database is contacted.
      DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  # Reports Learn guides whose documented source changed since the guide was
  # last reviewed (lib/learn/guide-sources.json). Advisory only — it emits
  # ::warning:: annotations and always exits 0, so stale docs surface in the
  # checks UI without ever blocking a code deploy.
  learn-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `git log --since` needs real history, not a shallow clone
      - run: node scripts/learn-drift.js

  # End-to-end tests (RBAC/IDOR regression + smoke). Gated OFF by default so it
  # never breaks CI before it's configured. To activate:
  #   1. Add repository secrets: E2E_DATABASE_URL, E2E_NEON_AUTH_BASE_URL,
  #      E2E_NEON_AUTH_COOKIE_SECRET (point at a branch that has the fixture
  #      users admin@/user@test.stackedbench.com — e.g. the dev branch).
  #   2. Set repository variable RUN_E2E = true.
  # See tests/e2e/README.md.
  e2e:
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.E2E_NEON_AUTH_COOKIE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer boots `npm run dev` against the configured DB.
      - run: npx playwright test rbac-idor.spec.ts --project=default
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
